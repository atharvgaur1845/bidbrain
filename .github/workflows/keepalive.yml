name: keep the demo awake

# Free Hugging Face Spaces sleep after ~48 h without traffic; judges may visit any
# day. Ping the health endpoint every 6 hours. Set the repository variable
# SPACE_URL (Settings -> Secrets and variables -> Actions -> Variables), e.g.
# https://atharvgaur1845-bidbrain.hf.space
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - name: wake and check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "${{ vars.SPACE_URL }}/api/health"; then echo; exit 0; fi
            echo "not up yet ($i) — waiting for the Space to wake"; sleep 50
          done
          exit 1
