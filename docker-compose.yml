# Local run of the full stack (same image as the hosted demo):
#   cp .env.example .env   # add GROQ_API_KEY / CEREBRAS_API_KEY (optional — everything except
#                          # free-text Q&A works without an LLM)
#   docker compose up --build
#   open http://localhost:7860          (UI + API + MCP at /mcp)
# Company memory and session graphs persist in the `bidbrain-state` volume across restarts
# (`docker compose down -v` wipes them); the base graph is rebuilt from facts at every boot.
services:
  bidbrain:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      BIDBRAIN_STATE_DIR: /app/state
    volumes:
      - bidbrain-state:/app/state
    stop_grace_period: 20s

volumes:
  bidbrain-state:
